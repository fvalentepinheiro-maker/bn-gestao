<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerencial BN | Financeiro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--azul:#1a4fa0;--verde:#0e7c5a;--vermelho:#c62828;--roxo:#6a3fb5;
--bg:#f5f6f8;--borda:#dde1e8;--txt:#111827;--cinza:#6b7280;--shadow:0 2px 8px rgba(0,0,0,.08)}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.top{background:var(--azul);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.top .brand{font-weight:700;font-size:1.1rem}.top .brand small{display:block;font-weight:400;font-size:.72rem;opacity:.85}
.top .right{display:flex;gap:10px;align-items:center;font-size:.8rem}
.top a,.top button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;font-size:.8rem;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar input[type=month]{padding:8px 10px;border:1.5px solid var(--borda);border-radius:8px;font:inherit}
.btn{padding:8px 14px;border:1.5px solid var(--borda);border-radius:8px;background:#fff;cursor:pointer;font:inherit;font-size:.85rem;font-weight:500}
.btn:hover{border-color:var(--azul);color:var(--azul)}
.btn.prim{background:var(--azul);color:#fff;border-color:var(--azul)}.btn.prim:hover{opacity:.92;color:#fff}
.btn.entrada{background:var(--verde);color:#fff;border-color:var(--verde)}
.btn.despesa{background:var(--vermelho);color:#fff;border-color:var(--vermelho)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.card{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.card .lbl{font-size:.78rem;color:var(--cinza)}.card .val{font-size:1.5rem;font-weight:700;margin-top:4px}
.card.e{border-top:3px solid var(--verde)}.card.d{border-top:3px solid var(--vermelho)}
.card.s{border-top:3px solid var(--azul)}.card.a{border-top:3px solid var(--roxo)}
h2{font-size:1rem;margin:18px 0 10px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--borda);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
th,td{padding:10px 12px;text-align:left;font-size:.85rem;border-bottom:1px solid var(--borda)}
th{background:#fafbfc;font-weight:600;color:var(--cinza);font-size:.76rem;text-transform:uppercase;letter-spacing:.03em}
tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:600}
.tag.ap{background:#efe7fb;color:var(--roxo)}
.acts button{background:none;border:none;cursor:pointer;font-size:.9rem;padding:2px 6px;color:var(--cinza)}
.acts button:hover{color:var(--azul)}
.vazio{padding:28px;text-align:center;color:var(--cinza);font-size:.9rem}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h3{margin-bottom:14px}
.field{margin-bottom:12px}.field label{display:block;font-size:.8rem;color:var(--cinza);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1.5px solid var(--borda);border-radius:8px;font:inherit}
.field.chk{display:flex;align-items:center;gap:8px}.field.chk input{width:auto}.field.chk label{margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .acts2{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.login{max-width:360px;margin:60px auto;background:#fff;padding:28px;border-radius:14px;box-shadow:var(--shadow)}
.login h3{margin-bottom:16px;color:var(--azul)}
.err{color:var(--vermelho);font-size:.82rem;margin-top:8px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<script>
globalThis.GSER_CONFIG = {
  supabaseUrl: 'https://twpndwaxxwduhouoauiu.supabase.co',
  supabasePublishableKey: 'sb_publishable_SlrJkFzc5ldN7E5xbksqJg_p4zGCzXP',
  sessionKey: 'gser.session.v1'
};
</script>
<div id="app"></div>
<div id="ov" class="overlay"><div class="modal" id="modal"></div></div>
<script type="module">
const cfg = globalThis.GSER_CONFIG||{};
const URL = String(cfg.supabaseUrl||'').replace(/\/+$/,'');
const KEY = String(cfg.supabasePublishableKey||'');
const SK  = cfg.sessionKey||'gser.session.v1';
const CATS = ['Médicos / Mão de obra','Impostos','Jurídico','Transporte','Alimentação','Marketing','Administrativo','Outros'];
const TIPOS_ENT = ['Recebimento de cliente','Aporte de capital','Outros'];
const PGTO = ['Transferência','PIX','Dinheiro','Cheque','Boleto','Outro'];
const app=document.getElementById('app'), ov=document.getElementById('ov'), modal=document.getElementById('modal');
let sess=null; try{sess=JSON.parse(localStorage.getItem(SK))}catch{}
const state={sess, profile:null, units:[], contracts:[], entries:[], month:new Date().toISOString().slice(0,7), err:''};

const money=x=>Number(x||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const comp=m=>m+'-01';
function setSess(s){state.sess=s; s?localStorage.setItem(SK,JSON.stringify(s)):localStorage.removeItem(SK);}

async function req(path,{method='GET',body,auth=true,headers={}}={}){
  if(auth && state.sess && state.sess.expires_at < Date.now()/1000+45){
    try{const s=await req('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:{refresh_token:state.sess.refresh_token}});
      setSess({...s,expires_at:Math.floor(Date.now()/1000)+s.expires_in});}catch{setSess(null);}
  }
  const h={apikey:KEY,...(auth&&state.sess?{Authorization:'Bearer '+state.sess.access_token}:{}),...headers};
  if(body!==undefined){h['Content-Type']='application/json';body=JSON.stringify(body);}
  const r=await fetch(URL+path,{method,headers:h,body});
  if(!r.ok){let e;try{e=await r.json()}catch{e={message:'Falha ('+r.status+')'}}
    throw new Error(e.msg||e.message||e.error_description||e.error||'Erro');}
  if(r.status===204)return null;
  const ct=r.headers.get('content-type')||'';return ct.includes('json')?r.json():r.text();
}
const rows=(t,q='')=>req('/rest/v1/'+t+'?select=*'+q);
const canEdit=()=>state.profile?.is_active && ['manager','operator'].includes(state.profile.role);

async function login(email,password){
  const s=await req('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:{email,password}});
  setSess({...s,expires_at:Math.floor(Date.now()/1000)+s.expires_in});
}
async function loadProfile(){
  const uid=state.sess?.user?.id; if(!uid)return null;
  const p=await rows('cm_profiles','&id=eq.'+uid); state.profile=p[0]||null;
}
async function loadAll(){
  [state.units,state.contracts]=await Promise.all([
    rows('cm_schedule_units','&order=display_order'),
    rows('cm_contracts','&select=id,contract_number,supplier_name&order=supplier_name')
  ]);
  await loadEntries();
  await loadTetos();
  await loadYear();
}
async function loadTetos(){
  state.cteto=await req('/rest/v1/cm_contracts?select=id,contract_number,supplier_name,teto_qtd,valor_norte&teto_qtd=not.is.null&order=contract_number.asc');
  // Executado = produção lançada na Escala (slots) ligada ao contrato
  const slots=await req('/rest/v1/cm_schedule_slots?select=contract_id,patients,status&contract_id=not.is.null');
  state.consumo={};
  for(const s of slots){if(['preenchido','confirmado'].includes(s.status))state.consumo[s.contract_id]=(state.consumo[s.contract_id]||0)+Number(s.patients||0);}
  // Recebido/Despesas = ledger financeiro (fonte única) vinculado ao contrato
  state.finAgg={};
  const add=(cid,k,v)=>{const a=state.finAgg[cid]||{rec:0,desp:0};a[k]+=Number(v||0);state.finAgg[cid]=a;};
  const fins=await req('/rest/v1/cm_fin_entries?select=kind,amount,contract_id&contract_id=not.is.null');
  for(const f of fins){add(f.contract_id, f.kind==='entrada'?'rec':'desp', f.amount);}
}
async function loadYear(){
  const y=state.month.slice(0,4);
  try{state.year=await req('/rest/v1/cm_fin_entries?select=*&competence=gte.'+y+'-01-01&competence=lte.'+y+'-12-31');}
  catch{state.year=[];}
  try{const d=await req('/rest/v1/cm_fin_entries?select=amount&kind=eq.despesa&status_fin=eq.dea');
    state.deaTotal=d.reduce((s,e)=>s+Number(e.amount),0);}catch{state.deaTotal=0;}
}
function mesAMes(){
  const y=state.year||[];
  const M=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const rec=Array(12).fill(0), desp=Array(12).fill(0);
  for(const e of y){const m=parseInt(e.competence.slice(5,7))-1; if(m>=0&&m<12){ if(e.kind==='entrada'){if(!e.is_aporte)rec[m]+=Number(e.amount);} else desp[m]+=Number(e.amount);}}
  const max=Math.max(1,...rec,...desp);
  let rows='';
  for(let i=0;i<12;i++){
    if(!rec[i]&&!desp[i])continue;
    const s=rec[i]-desp[i];
    rows+=`<tr><td>${M[i]}</td>
      <td class="r" style="color:var(--verde)">${money(rec[i])}</td>
      <td class="r" style="color:var(--vermelho)">${money(desp[i])}</td>
      <td class="r" style="color:${s<0?'var(--vermelho)':'var(--azul)'}">${money(s)}</td>
      <td><div style="display:flex;gap:3px;align-items:flex-end;height:24px">
        <div title="Receita" style="width:12px;border-radius:2px;background:var(--verde);height:${Math.max(2,Math.round(rec[i]/max*24))}px"></div>
        <div title="Despesa" style="width:12px;border-radius:2px;background:var(--vermelho);height:${Math.max(2,Math.round(desp[i]/max*24))}px"></div>
      </div></td></tr>`;
  }
  if(!rows)rows='<tr><td colspan="5" class="vazio">Sem lançamentos no ano.</td></tr>';
  return `<table><thead><tr><th>Mês</th><th class="r">Receita</th><th class="r">Despesa</th><th class="r">Saldo</th><th>Evolução</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function tetoTable(){
  const list=state.cteto||[];
  if(!list.length)return '<div class="vazio">Nenhum contrato com teto definido.</div>';
  const row=c=>{
    const cons=state.consumo[c.id]||0, saldo=(c.teto_qtd||0)-cons;
    const ag=state.finAgg[c.id]||{rec:0,desp:0};
    const norte=(c.teto_qtd||0)*Number(c.valor_norte||0), liq=ag.rec-ag.desp;
    const pct=c.teto_qtd?Math.min(100,Math.round(cons/c.teto_qtd*100)):0;
    return `<tr>
      <td>${esc(c.contract_number)}<br><small style="color:var(--cinza)">${esc(c.supplier_name)}</small></td>
      <td class="r">${c.teto_qtd||0}</td><td class="r">${cons}</td>
      <td class="r" style="color:${saldo<0?'var(--vermelho)':'var(--verde)'}">${saldo} <small style="color:var(--cinza)">(${pct}%)</small></td>
      <td class="r">${money(norte)}</td><td class="r">${money(ag.rec)}</td><td class="r">${money(ag.desp)}</td>
      <td class="r" style="color:${liq<0?'var(--vermelho)':'var(--verde)'}">${money(liq)}</td>
      <td class="acts r">${canEdit()?`<button data-teto="${c.id}">✏️</button>`:''}</td></tr>`;
  };
  return `<table><thead><tr><th>Contrato</th><th class="r">Teto</th><th class="r">Executado</th><th class="r">Saldo</th><th class="r">Norte</th><th class="r">Recebido</th><th class="r">Despesas</th><th class="r">Líquido</th><th></th></tr></thead><tbody>${list.map(row).join('')}</tbody></table>`;
}
function openTeto(id){
  const c=state.cteto.find(x=>x.id===id);
  modal.innerHTML=`<h3>Teto — ${esc(c.contract_number)}</h3>
    <div class="row2">
      <div class="field"><label>Teto (atendimentos)</label><input type="number" id="t_qtd" value="${c.teto_qtd||''}"></div>
      <div class="field"><label>Valor-norte (R$/atend.)</label><input type="number" step="0.01" id="t_val" value="${c.valor_norte||''}"></div>
    </div><div class="err" id="t_err"></div>
    <div class="acts2"><button class="btn" id="t_cancel">Cancelar</button><button class="btn prim" id="t_save">Salvar</button></div>`;
  ov.classList.add('on');
  document.getElementById('t_cancel').onclick=()=>ov.classList.remove('on');
  document.getElementById('t_save').onclick=async()=>{
    const body={teto_qtd:parseInt(document.getElementById('t_qtd').value)||null,valor_norte:parseFloat(document.getElementById('t_val').value)||null};
    try{await req('/rest/v1/cm_contracts?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body});
      ov.classList.remove('on');await loadTetos();render();}
    catch(e){document.getElementById('t_err').textContent=e.message;}
  };
}
async function loadEntries(){
  state.entries=await req('/rest/v1/cm_fin_entries?select=*&competence=eq.'+comp(state.month)+'&order=entry_date.asc');
}

function render(){
  if(!state.sess){return renderLogin();}
  const ents=state.entries.filter(e=>e.kind==='entrada'), desps=state.entries.filter(e=>e.kind==='despesa');
  const totE=ents.filter(e=>!e.is_aporte).reduce((s,e)=>s+Number(e.amount),0);
  const totD=desps.reduce((s,e)=>s+Number(e.amount),0);
  const totAp=ents.filter(e=>e.is_aporte).reduce((s,e)=>s+Number(e.amount),0);
  const saldo=totE-totD;
  const yEnt=state.year||[], stOf=e=>(e.status_fin||'liquidado');
  const sumK=(kind,st)=>yEnt.filter(e=>e.kind===kind&&stOf(e)===st&&!(kind==='entrada'&&e.is_aporte)).reduce((s,e)=>s+Number(e.amount),0);
  const recAno=yEnt.filter(e=>e.kind==='entrada'&&!e.is_aporte).reduce((s,e)=>s+Number(e.amount),0);
  const despAno=yEnt.filter(e=>e.kind==='despesa').reduce((s,e)=>s+Number(e.amount),0);
  const liquidado=sumK('entrada','liquidado')-sumK('despesa','liquidado');
  const emAberto=sumK('entrada','aberto')-sumK('despesa','aberto');
  const anoLbl=state.month.slice(0,4);
  const unitName=id=>state.units.find(u=>u.id===id)?.name||'';
  const contrName=id=>{const c=state.contracts.find(c=>c.id===id);return c?`${c.contract_number} · ${c.supplier_name}`:'';};
  const rowHtml=e=>`<tr>
    <td>${esc((e.entry_date||'').slice(8,10))}/${esc((e.entry_date||'').slice(5,7))}</td>
    <td>${esc(e.category)} ${e.is_aporte?'<span class="tag ap">aporte</span>':''}${(e.status_fin||'liquidado')==='aberto'?' <span class="tag" style="background:#fff4e5;color:#b26a00">em aberto</span>':''}${e.status_fin==='dea'?' <span class="tag" style="background:#ececfb;color:#4a3fb0">DEA</span>':''}</td>
    <td>${esc(e.description||'')}${e.source?' · '+esc(e.source):''}</td>
    <td>${esc(unitName(e.unit_id)||contrName(e.contract_id)||'—')}</td>
    <td>${e.has_nf?('NF'+(e.nf_number?' '+esc(e.nf_number):'')):'<span style="color:var(--cinza)">sem NF</span>'}${e.payment_method?'<br><small style="color:var(--cinza)">'+esc(e.payment_method)+'</small>':''}</td>
    <td class="r">${money(e.amount)}</td>
    <td class="acts r">${canEdit()?`<button data-ed="${e.id}">✏️</button><button data-del="${e.id}">🗑️</button>`:''}</td>
  </tr>`;
  const tbl=(list,vazio)=>list.length?`<table><thead><tr><th>Data</th><th>Categoria</th><th>Descrição</th><th>Vínculo</th><th>NF / Pgto</th><th class="r">Valor</th><th></th></tr></thead><tbody>${list.map(rowHtml).join('')}</tbody></table>`:`<div class="vazio">${vazio}</div>`;
  app.innerHTML=`
  <div class="top">
    <div class="brand">Gerencial BN<small>Financeiro</small></div>
    <div class="right"><span>${esc(state.profile?.full_name||'')}</span>
      <a href="../">⟵ Gestão</a><button id="out">Sair</button></div>
  </div>
  <div class="wrap">
    <div class="toolbar">
      <input type="month" id="mon" value="${state.month}">
      ${canEdit()?`<button class="btn entrada" id="addE">+ Entrada</button>
      <button class="btn despesa" id="addD">+ Despesa</button>`:''}
    </div>
    <div class="cards">
      <div class="card e"><div class="lbl">Entradas</div><div class="val">${money(totE)}</div></div>
      <div class="card d"><div class="lbl">Despesas</div><div class="val">${money(totD)}</div></div>
      <div class="card s"><div class="lbl">Saldo do mês</div><div class="val" style="color:${saldo<0?'var(--vermelho)':'var(--verde)'}">${money(saldo)}</div></div>
      <div class="card a"><div class="lbl">Aporte de capital</div><div class="val">${money(totAp)}</div></div>
    </div>
    <h2>Visão gerencial — ano ${anoLbl}</h2>
    <div class="cards">
      <div class="card e"><div class="lbl">Receita do ano</div><div class="val">${money(recAno)}</div></div>
      <div class="card d"><div class="lbl">Despesas do mês</div><div class="val">${money(totD)}</div></div>
      <div class="card d"><div class="lbl">Despesas do ano</div><div class="val">${money(despAno)}</div></div>
      <div class="card e"><div class="lbl">Liquidado (ano)</div><div class="val">${money(liquidado)}</div></div>
      <div class="card a"><div class="lbl">Em aberto (ano)</div><div class="val">${money(emAberto)}</div></div>
      <div class="card d"><div class="lbl">DEA (exerc. anteriores)</div><div class="val">${money(state.deaTotal||0)}</div></div>
    </div>
    <h2>Evolução mês a mês — ano ${anoLbl}</h2>${mesAMes()}
    <h2>Entradas</h2>${tbl(ents,'Sem entradas neste mês.')}
    <h2>Despesas</h2>${tbl(desps,'Sem despesas neste mês.')}
    <h2>Por contrato — teto &amp; resultado <small style="color:var(--cinza);font-weight:400">(acumulado, não só o mês)</small></h2>${tetoTable()}
  </div>`;
  document.getElementById('mon').onchange=async e=>{state.month=e.target.value;await loadEntries();await loadYear();render();};
  document.getElementById('out').onclick=()=>{setSess(null);state.profile=null;render();};
  document.getElementById('addE')?.addEventListener('click',()=>openForm('entrada'));
  document.getElementById('addD')?.addEventListener('click',()=>openForm('despesa'));
  app.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{const e=state.entries.find(x=>x.id===b.dataset.ed);openForm(e.kind,e);});
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delEntry(b.dataset.del));
  app.querySelectorAll('[data-teto]').forEach(b=>b.onclick=()=>openTeto(b.dataset.teto));
}

function openForm(kind,e=null){
  const isE=kind==='entrada';
  const catOpts=(isE?TIPOS_ENT:CATS).map(c=>`<option ${e&&e.category===c?'selected':''}>${c}</option>`).join('');
  const unitOpts=['<option value="">— unidade —</option>',...state.units.map(u=>`<option value="${u.id}" ${e&&e.unit_id===u.id?'selected':''}>${esc(u.name)}</option>`)].join('');
  const contrOpts=['<option value="">— contrato —</option>',...state.contracts.map(c=>`<option value="${c.id}" ${e&&e.contract_id===c.id?'selected':''}>${esc(c.contract_number)} · ${esc(c.supplier_name)}</option>`)].join('');
  modal.innerHTML=`<h3>${e?'Editar':'Nova'} ${isE?'entrada':'despesa'}</h3>
    <div class="row2">
      <div class="field"><label>Data</label><input type="date" id="f_date" value="${e?e.entry_date:state.month+'-'+String(new Date().getDate()).padStart(2,'0')}"></div>
      <div class="field"><label>Valor (R$)</label><input type="number" step="0.01" id="f_amount" value="${e?e.amount:''}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>${isE?'Tipo':'Categoria'}</label><select id="f_cat">${catOpts}</select></div>
      <div class="field"><label>Situação</label><select id="f_status">
        <option value="liquidado" ${!e||(e.status_fin||'liquidado')==='liquidado'?'selected':''}>Liquidado</option>
        <option value="aberto" ${e&&e.status_fin==='aberto'?'selected':''}>Em aberto</option>
        <option value="dea" ${e&&e.status_fin==='dea'?'selected':''}>DEA (exerc. anterior)</option></select></div>
    </div>
    ${isE?`<div class="field chk"><input type="checkbox" id="f_aporte" ${e&&e.is_aporte?'checked':''}><label>É aporte de capital externo</label></div>
    <div class="field"><label>Origem do aporte / cliente</label><input id="f_source" value="${e?esc(e.source||''):''}"></div>`:''}
    <div class="field"><label>Descrição</label><input id="f_desc" value="${e?esc(e.description||''):''}"></div>
    <div class="row2">
      <div class="field"><label>Unidade (opcional)</label><select id="f_unit">${unitOpts}</select></div>
      <div class="field"><label>Contrato (opcional)</label><select id="f_contr">${contrOpts}</select></div>
    </div>
    <div class="row2">
      <div class="field"><label>Forma de pagamento</label><select id="f_pgto"><option value="">—</option>${PGTO.map(x=>`<option ${e&&e.payment_method===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="field"><label>Nº / série da NF</label><input id="f_nf_num" value="${e?esc(e.nf_number||''):''}"></div>
    </div>
    <div class="field chk"><input type="checkbox" id="f_has_nf" ${e&&e.has_nf?'checked':''}><label>Teve nota fiscal (NF)</label></div>
    <div class="err" id="f_err"></div>
    <div class="acts2"><button class="btn" id="f_cancel">Cancelar</button><button class="btn prim" id="f_save">Salvar</button></div>`;
  ov.classList.add('on');
  document.getElementById('f_cancel').onclick=()=>ov.classList.remove('on');
  document.getElementById('f_save').onclick=()=>saveEntry(kind,e);
}

async function saveEntry(kind,e){
  const g=id=>document.getElementById(id);
  const amount=parseFloat(g('f_amount').value);
  if(!(amount>=0)||isNaN(amount)){g('f_err').textContent='Informe um valor válido.';return;}
  const isE=kind==='entrada';
  const body={kind,entry_date:g('f_date').value,competence:comp(state.month),
    category:g('f_cat').value,description:g('f_desc').value||null,amount,
    unit_id:g('f_unit').value||null,contract_id:g('f_contr').value||null,
    is_aporte:isE?(g('f_aporte').checked || g('f_cat').value==='Aporte de capital'):false,
    source:isE?(g('f_source').value||null):null,
    status_fin:g('f_status').value,
    payment_method:g('f_pgto').value||null,
    nf_number:g('f_nf_num').value||null,
    has_nf:g('f_has_nf').checked || !!g('f_nf_num').value};
  try{
    if(e){await req('/rest/v1/cm_fin_entries?id=eq.'+e.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body});}
    else{await req('/rest/v1/cm_fin_entries',{method:'POST',headers:{Prefer:'return=minimal'},body});}
    ov.classList.remove('on');await loadEntries();render();
  }catch(err){g('f_err').textContent=err.message;}
}
async function delEntry(id){
  if(!confirm('Excluir este lançamento?'))return;
  try{await req('/rest/v1/cm_fin_entries?id=eq.'+id,{method:'DELETE',headers:{Prefer:'return=minimal'}});
    await loadEntries();render();}catch(err){alert(err.message);}
}

function renderLogin(){
  app.innerHTML=`<div class="login"><h3>Gerencial BN — Financeiro</h3>
    <div class="field"><label>E-mail</label><input id="l_email" type="email"></div>
    <div class="field"><label>Senha</label><input id="l_pass" type="password"></div>
    <div class="err" id="l_err">${esc(state.err)}</div>
    <button class="btn prim" id="l_btn" style="width:100%">Entrar</button>
    <p style="margin-top:12px;font-size:.8rem"><a href="../">⟵ Voltar ao Gestão</a></p></div>`;
  document.getElementById('l_btn').onclick=async()=>{
    state.err='';
    try{await login(document.getElementById('l_email').value.trim(),document.getElementById('l_pass').value);
      await boot();}catch(e){state.err=/Invalid login/.test(e.message)?'E-mail ou senha incorretos.':e.message;renderLogin();}
  };
}

async function boot(){
  if(!state.sess){renderLogin();return;}
  try{await loadProfile();
    if(!state.profile?.is_active){state.err='Seu usuário não está ativo.';setSess(null);renderLogin();return;}
    await loadAll();render();
  }catch(e){
    if(/401|403|JWT|token/i.test(e.message)){setSess(null);renderLogin();}
    else{app.innerHTML='<div class="wrap"><div class="vazio">Erro ao carregar: '+esc(e.message)+'</div></div>';}
  }
}
boot();
</script>
</body>
</html>
